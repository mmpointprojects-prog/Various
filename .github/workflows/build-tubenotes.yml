name: Build TubeNotes APK

on:
  push:
    branches: ["main", "ccr-146aeacb-l4dp84"]
    paths: ["tubenotes/**", ".github/workflows/build-tubenotes.yml", "settings.gradle.kts", "build.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :tubenotes:testDebugUnitTest :tubenotes:assembleDebug --console=plain

      - name: Name APK with timestamp
        id: name
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          cp tubenotes/build/outputs/apk/debug/tubenotes-debug.apk "TubeNotes_${STAMP}.apk"
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TubeNotes_${{ steps.name.outputs.stamp }}
          path: TubeNotes_*.apk

      # A GitHub Release is the easiest place to grab the APK from your phone's browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tubenotes-${{ steps.name.outputs.stamp }}" TubeNotes_*.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "TubeNotes ${{ steps.name.outputs.stamp }} (UTC)" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download the .apk on your phone and open it to install/update."
